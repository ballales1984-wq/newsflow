<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>
        {{ isLoginMode ? 'Accedi' : 'Registrati' }}
      </mat-card-title>
      <mat-card-subtitle>
        {{ isLoginMode ? 'Benvenuto su NewsFlow' : 'Crea il tuo account' }}
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="authForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" autocomplete="email">
          <mat-error *ngIf="authForm.get('email')?.hasError('required')">
            Email obbligatoria
          </mat-error>
          <mat-error *ngIf="authForm.get('email')?.hasError('email')">
            Email non valida
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width" *ngIf="!isLoginMode">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" autocomplete="username">
          <mat-error *ngIf="authForm.get('username')?.hasError('required')">
            Username obbligatorio
          </mat-error>
          <mat-error *ngIf="authForm.get('username')?.hasError('minlength')">
            Minimo 3 caratteri
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width" *ngIf="!isLoginMode">
          <mat-label>Nome completo</mat-label>
          <input matInput formControlName="fullName" autocomplete="name">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password" autocomplete="current-password">
          <mat-error *ngIf="authForm.get('password')?.hasError('required')">
            Password obbligatoria
          </mat-error>
          <mat-error *ngIf="authForm.get('password')?.hasError('minlength')">
            Minimo 8 caratteri
          </mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="full-width" [disabled]="isLoading || authForm.invalid">
          <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
          <span *ngIf="!isLoading">{{ isLoginMode ? 'Accedi' : 'Registrati' }}</span>
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <button mat-button (click)="toggleMode()">
        {{ isLoginMode ? 'Non hai un account? Registrati' : 'Hai già un account? Accedi' }}
      </button>
    </mat-card-actions>
  </mat-card>
</div>
