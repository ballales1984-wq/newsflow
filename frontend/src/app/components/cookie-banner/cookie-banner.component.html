<div class="cookie-banner" *ngIf="showBanner">
  <div class="cookie-content">
    <div class="cookie-text">
      <h4>🍪 Utilizzo dei Cookie</h4>
      <p>
        Questo sito utilizza cookie essenziali per il funzionamento e cookie opzionali (analitici e pubblicitari) per migliorare l'esperienza.
        <a routerLink="/privacy" (click)="showBanner = false">Privacy Policy</a> |
        <a routerLink="/cookie-policy" (click)="showBanner = false">Cookie Policy</a>
      </p>
    </div>
    <div class="cookie-actions">
      <button class="btn-reject" (click)="rejectCookies()">
        Rifiuta
      </button>
      <button class="btn-accept" (click)="acceptCookies()">
        Accetta tutto
      </button>
    </div>
  </div>
</div>
