<mat-toolbar color="primary" class="header">
  <div class="header-content">
    <div class="logo-section">
      <a routerLink="/" class="logo-badge">NF</a>
      <div class="datetime-display">
        <span class="date">{{ currentDate }}</span>
        <span class="time">{{ currentTime }}</span>
      </div>
      <div class="weather-display" *ngIf="weatherData">
        <mat-icon class="weather-icon">{{ weatherData.icon }}</mat-icon>
        <div class="weather-info">
          <span class="temperature">{{ weatherData.temperature }}°</span>
          <span class="condition">{{ weatherData.condition }}</span>
          <span class="location">{{ weatherData.city }}</span>
        </div>
      </div>
    </div>

    <div class="title-section">
      <a routerLink="/" class="main-title">
        <span class="title-news">News</span>
        <span class="title-flow">Flow</span>
      </a>
    </div>

    <div class="actions-section">
      <button 
        mat-icon-button 
        matTooltip="Articoli salvati"
        routerLink="/saved"
        [attr.aria-label]="'Articoli salvati' + (savedCount > 0 ? ': ' + savedCount : '')"
      >
        <mat-icon 
          [matBadge]="savedCount > 0 ? savedCount : null" 
          matBadgeColor="warn"
        >
          bookmark
        </mat-icon>
      </button>

      <!-- User logged in -->
      <button mat-icon-button [matMenuTriggerFor]="userMenu" *ngIf="currentUser" [attr.aria-label]="'Menu utente: ' + currentUser.username">
        <div class="user-avatar">{{ currentUser.username.substring(0, 2).toUpperCase() }}</div>
      </button>
      
      <!-- User not logged in -->
      <button mat-icon-button routerLink="/login" *ngIf="!currentUser" matTooltip="Accedi">
        <mat-icon>login</mat-icon>
      </button>
      
      <mat-menu #userMenu="matMenu">
        <div class="user-menu-header" *ngIf="currentUser">
          <div class="user-avatar-large">{{ currentUser.username.substring(0, 2).toUpperCase() }}</div>
          <div class="user-info">
            <div class="user-name">{{ currentUser.username }}</div>
            <div class="user-status">Utente registrato</div>
          </div>
        </div>
        <mat-divider *ngIf="currentUser"></mat-divider>
        <button mat-menu-item routerLink="/saved">
          <mat-icon>bookmark</mat-icon>
          <span>Articoli salvati ({{ savedCount }})</span>
        </button>
        <button mat-menu-item>
          <mat-icon>settings</mat-icon>
          <span>Impostazioni</span>
        </button>
        <mat-divider *ngIf="currentUser"></mat-divider>
        <button mat-menu-item routerLink="/privacy">
          <mat-icon>privacy_tip</mat-icon>
          <span>Privacy Policy</span>
        </button>
        <button mat-menu-item routerLink="/terms">
          <mat-icon>description</mat-icon>
          <span>Termini di Servizio</span>
        </button>
        <mat-divider *ngIf="currentUser"></mat-divider>
        <button mat-menu-item *ngIf="currentUser" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Esci</span>
        </button>
        <button mat-menu-item *ngIf="!currentUser" routerLink="/login">
          <mat-icon>login</mat-icon>
          <span>Accedi / Registrati</span>
        </button>
      </mat-menu>
    </div>
  </div>
</mat-toolbar>
